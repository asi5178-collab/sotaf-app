<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>{% block title %}SOTAF App{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  label { display: block; font-weight: bold; margin: 1rem 0 0.25rem; }
  input[type="text"], textarea {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 1rem;
    padding: 0.5rem; border: 1px solid #8886; border-radius: 6px;
  }
  textarea { min-height: 80px; resize: vertical; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: 1.5rem 0; padding: 0 1rem 1rem; }
  legend { font-weight: bold; padding: 0 0.5rem; }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
  button { padding: 0.6rem 1.4rem; font-size: 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #8886; }
  button.primary { background: #2563eb; color: white; border-color: #2563eb; }
  a.button { display: inline-block; padding: 0.5rem 1rem; border: 1px solid #8886; border-radius: 6px; text-decoration: none; color: inherit; }
  .error { color: #b00020; font-weight: bold; }
  .issues { background: rgba(255, 200, 0, 0.15); border: 1px solid #cc9900; padding: 0.75rem 1rem; border-radius: 6px; }
  .issues.ok { background: rgba(0, 160, 0, 0.12); border-color: #2a8; }
  .finding { border: 1px solid #8884; border-radius: 8px; padding: 0.75rem 1rem; margin: 0.75rem 0; }
  .finding .doc-badge { display: inline-block; background: #2563eb; color: white; border-radius: 4px; padding: 0.1rem 0.5rem; font-weight: bold; margin-inline-end: 0.5rem; }
  details { border: 1px solid #8883; border-radius: 6px; margin: 0.5rem 0; padding: 0.4rem 0.8rem; }
  summary { cursor: pointer; font-weight: bold; }
  pre { direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
