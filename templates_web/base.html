<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SOTAF Studio{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="shell">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="mark">SOTAF Studio</span>
        <span class="tag">Socio-Technological Architecture Framework</span>
      </a>
      <nav class="navlinks">
        <a href="{{ url_for('home') }}">פרויקט חדש</a>
        <a href="{{ url_for('library') }}">ספריית פרויקטים</a>
        {% if has_project %}<a href="{{ url_for('hub') }}">הפרויקט שלי</a>{% endif %}
      </nav>
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">SOTAF Studio — כלי עזר להכנת מסמכי SOTAF, מבוסס על מסגרת ה-SOTAF של אוניברסיטת אריאל</footer>
  <script src="{{ url_for('static', filename='js/dynform.js') }}"></script>
</body>
</html>
